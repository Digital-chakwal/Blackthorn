<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLACK THORN | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --bg: #000; --accent: #00ff66; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        #cursor { position: fixed; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); box-shadow: 0 0 20px var(--accent); }
        nav { display: flex; justify-content: space-between; padding: 25px 10%; position: fixed; width: 100%; top: 0; z-index: 1000; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #111; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; } .logo span { color: var(--accent); }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav ul a { font-size: 0.8rem; text-transform: uppercase; color: #fff; text-decoration: none; letter-spacing: 2px; }
        nav ul a:hover { color: var(--accent); }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(3rem, 10vw, 7rem); font-weight: 800; line-height: 0.9; margin-bottom: 20px; }
        .hero span { color: var(--accent); text-shadow: 0 0 30px var(--accent); }
        .btn { padding: 18px 40px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 600; letter-spacing: 2px; transition: 0.5s; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 50px var(--accent); }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <nav>
        <div class="logo">BLACK <span>THORN</span></div>
        <ul>
            <li><a href="index.html" style="color: var(--accent);">Home</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="vault.html">Vault</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="hero">
        <h1 data-aos="fade-down">THE DIGITAL <br><span>SHARPNESS.</span></h1>
        <p data-aos="fade-up" data-aos-delay="200" style="color: #888; margin-bottom: 40px; font-family: 'Space Mono';">// MINIMAL_DESIGN_MAX_IMPACT</p>
        <a href="project.html" class="btn" data-aos="zoom-in" data-aos-delay="400">EXPLORE ARCHIVE</a>
    </section>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
